<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura de uma página HTML</title>
  <desc id="desc">Blocos representando cabeçalho, navegação, conteúdo e rodapé.</desc>
  <rect width="800" height="450" fill="#eaf5f1"/>
  <rect x="92" y="52" width="616" height="76" rx="18" fill="#176b5b"/>
  <rect x="92" y="148" width="616" height="44" rx="14" fill="#d95f4b"/>
  <rect x="92" y="212" width="400" height="132" rx="18" fill="#ffffff" stroke="#abc9c0" stroke-width="4"/>
  <rect x="512" y="212" width="196" height="132" rx="18" fill="#dff3ec" stroke="#abc9c0" stroke-width="4"/>
  <rect x="92" y="364" width="616" height="36" rx="12" fill="#17212b"/>
  <g fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">
